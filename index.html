<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Koza — planla, odaklan, dolu dolu yaşa. Görevler, pomodoro, alışkanlıklar ve notlar için sıcak bir günlük planlayıcı." />
    <meta name="theme-color" content="#f4ece3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Plus+Jakarta+Sans:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <title>Koza · günlük planlayıcı</title>
    <script>
      // apply saved theme before paint to avoid a flash
      try {
        var t = JSON.parse(localStorage.getItem('koza:theme'));
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
